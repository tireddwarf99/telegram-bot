services:
  - type: worker         # worker — фоновый процесс без HTTP, идеально для Telegram-бота
    name: telegram-bot
    runtime: node
    buildCommand: npm ci && mkdir -p bin && curl -fL --retry 3 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o bin/yt-dlp && chmod +x bin/yt-dlp
    startCommand: npm start
    envVars:
      - key: TELEGRAM_API
        sync: false      # значение задаётся вручную в Dashboard
      - key: RAPID_API_KEY
        sync: false
      - key: RAPID_API_HOST
        sync: false
      - key: RAPID_API_KEY_YOUTUBE
        sync: false
      - key: RAPID_API_HOST_YOUTUBE
        sync: false
